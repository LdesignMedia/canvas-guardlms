name: Canvas connector
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ruby: '3.1'
            rails: '~> 7.2.0'
          - ruby: '3.4'
            rails: '~> 8.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem install minitest -v '~> 5.0' --no-document
      - run: gem install railties -v "${{ matrix.rails }}" --no-document
      - run: for test in test/*_test.rb; do ruby "$test" --no-plugins || exit 1; done
      - run: gem build guardlms_canvas.gemspec
